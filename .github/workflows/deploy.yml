name: Deploy uploader archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uploader-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Ensure assets-only configuration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (config.main || config.assets?.run_worker_first !== false || config.assets?.directory !== './out') {
            throw new Error('Deployment must serve static assets without a Worker script.');
          }
          NODE
      - name: Deploy static assets
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check public routes
        run: |
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 10 --connect-timeout 15 --max-time 60 https://uploader.viprpg.org/ --output /dev/null
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 10 --connect-timeout 15 --max-time 60 https://uploader.viprpg.org/part4past/download/1 --output /dev/null
